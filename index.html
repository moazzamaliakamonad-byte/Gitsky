<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="moazzamaliakamonad-byte" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gitsky — Your repo's night sky</title>
    <meta
      name="description"
      content="Paste any public GitHub repo and explore it as a living 3D galaxy. Folders are star systems, files are stars, recent commits streak through as comets."
    />
    <meta name="theme-color" content="#04060d" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gitsky" />
    <meta property="og:title" content="Gitsky — Your repo's night sky" />
    <meta
      property="og:description"
      content="Paste any public GitHub repo and explore it as a living 3D galaxy. No sign-up, no server."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A spiral galaxy of stars made from the files of the vite repository." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.jpg" />

    <!-- Start fetching the landing sky in parallel with the app code. -->
    <link rel="preload" href="%BASE_URL%snapshots/index.json" as="fetch" crossorigin />
    <link rel="preload" href="%BASE_URL%snapshots/vitejs__vite.json" as="fetch" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <!-- First paint, before any JavaScript: the same deep-space backdrop, so the page
         is never a black void while the galaxy loads. React replaces #root's contents. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04060d;
      }
      .boot {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at 50% 38%, #0b1638 0%, #04060d 62%);
      }
      .boot::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 38%;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 0 40px 18px rgba(255, 214, 160, 0.35),
          -312px -180px 0 0 rgba(231, 236, 255, 0.5),
          264px -132px 0 0 rgba(231, 236, 255, 0.35),
          -420px 96px 0 0 rgba(231, 236, 255, 0.3),
          388px 150px 0 0 rgba(231, 236, 255, 0.45),
          -120px 240px 0 0 rgba(231, 236, 255, 0.25),
          150px -260px 0 0 rgba(231, 236, 255, 0.3),
          520px -40px 0 0 rgba(231, 236, 255, 0.2),
          -560px -60px 0 0 rgba(231, 236, 255, 0.25);
        animation: boot-breathe 2.4s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        50% {
          opacity: 0.6;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"></div></div>
    <noscript>
      <p style="color: #e7ecff; font-family: system-ui; padding: 24px">
        Gitsky draws your repo as a 3D galaxy and needs JavaScript and WebGL.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
