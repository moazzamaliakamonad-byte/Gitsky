<svg xmlns="http://www.w3.org/2000/svg" width="167" height="20" viewBox="0 0 167 20" role="img" aria-label="Gitsky: view the galaxy">
  <title>Gitsky: view the galaxy</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16244f"/>
      <stop offset="1" stop-color="#060a18"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc983"/>
      <stop offset="1" stop-color="#ffb35c"/>
    </linearGradient>
    <clipPath id="r"><rect width="167" height="20" rx="3"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="67" height="20" fill="url(#sky)"/>
    <rect x="67" width="100" height="20" fill="url(#amber)"/>
    <rect x="66" width="1" height="20" fill="#5ee0c8" opacity=".7"/>
  </g>
  <!-- The git constellation from the logo, at badge size. -->
  <g transform="translate(5 3) scale(.22)">
    <g fill="none" stroke="#9db4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 47 L18 38 L30 18 L43 34 L30 50 L18 38"/>
      <path d="M43 34 L51 23" stroke="#ffc88a"/>
    </g>
    <g fill="#fff" stroke="#0a1128" stroke-width="3">
      <circle cx="18" cy="38" r="5"/>
      <circle cx="30" cy="50" r="4.4"/>
      <circle cx="43" cy="34" r="5"/>
    </g>
    <path d="M30 8 C31 15.5 32.5 17 40 18 C32.5 19 31 20.5 30 28 C29 20.5 27.5 19 20 18 C27.5 17 29 15.5 30 8Z" fill="#fff"/>
    <path d="M52 10 C53 17.5 54.5 19 62 20 C54.5 21 53 22.5 52 30 C51 22.5 49.5 21 42 20 C49.5 19 51 17.5 52 10Z" fill="#ffb35c"/>
  </g>
  <g font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text x="24" y="14" fill="#e7ecff" textLength="36" lengthAdjust="spacingAndGlyphs">Gitsky</text>
    <text x="74" y="14" fill="#1a0f02" textLength="86" lengthAdjust="spacingAndGlyphs">view the galaxy</text>
  </g>
</svg>
